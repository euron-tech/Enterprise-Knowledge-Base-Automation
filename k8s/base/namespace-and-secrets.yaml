# Namespace, IRSA service account, and External Secrets wiring.
# Secrets reach pods from AWS Secrets Manager at runtime — never from an image
# layer, a ConfigMap, or a committed file.
#
# Apply order: namespace -> ESO (helm) -> SecretStore -> ExternalSecret -> workloads.
# ACCOUNT_ID and OIDC_PROVIDER are substituted by scripts/wire_cluster.sh from
# Terraform outputs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ekba-dev
  labels:
    name: ekba-dev
    # Enforce the restricted Pod Security Standard at the namespace level, so a
    # workload cannot opt out of non-root / no-privilege-escalation.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# IRSA: the API pod's AWS identity. One role per workload, least privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ekba-api
  namespace: ekba-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ekba-dev-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ekba-external-secrets
  namespace: ekba-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ekba-dev-external-secrets
---
# Where secrets come from. Scoped to this project's path by the IAM role behind
# the service account — the store itself cannot reach another project's secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: ekba-dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: ekba-external-secrets
---
# Materialises ekba/dev/* into a Kubernetes Secret the Deployment consumes.
# refreshInterval means a rotated secret reaches pods without a redeploy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ekba-secrets
  namespace: ekba-dev
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: ekba-secrets
    creationPolicy: Owner
  data:
    - secretKey: EURI_API_KEY
      remoteRef:
        key: ekba/dev/euri-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: ekba/dev/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: ekba/dev/redis-url
    - secretKey: QDRANT_URL
      remoteRef:
        key: ekba/dev/qdrant-url
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: ekba/dev/qdrant-api-key
