apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekba-api
  labels: { app: ekba-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ekba-api }
  template:
    metadata:
      labels: { app: ekba-api }
    spec:
      serviceAccountName: ekba-api        # IRSA; one role per workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Referenced by digest, never :latest — set by the deploy pipeline.
          image: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/ekba/api@sha256:REPLACED_BY_CI
          ports: [{ containerPort: 8000, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          envFrom:
            # Non-secret configuration and public identifiers.
            - configMapRef: { name: ekba-config }
            # Credentials, populated by the External Secrets Operator from
            # AWS Secrets Manager. Never baked into the image.
            - secretRef: { name: ekba-secrets }
          # kubelet probes by pod IP, so the Host header would be "10.42.x.y:8000"
          # and TrustedHostMiddleware answers 400. Sending an explicit trusted Host
          # keeps the probes working without loosening trusted-host validation.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: ekba-api }]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{ name: Host, value: ekba-api }]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: ekba-api }]
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ekba-api
spec:
  selector: { app: ekba-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ekba-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ekba-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ekba-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ekba-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
